<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Sistem Penilaian 5R</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f0f4f8;--sidebar:#0f172a;--sidebar-hover:#1e293b;--primary:#2563eb;--primary-dark:#1d4ed8;--accent:#f59e0b;--danger:#ef4444;--card:#fff;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
#login-screen{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#1e40af 100%)}
.login-box{background:var(--card);border-radius:16px;padding:36px 32px;width:92%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#2563eb,#3b82f6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;flex-shrink:0}
.login-logo-text{font-weight:800;font-size:17px;line-height:1.3;color:var(--text)}.login-logo-text span{color:#2563eb}
.login-error{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px;display:none;align-items:center;gap:6px}.login-error.show{display:flex}
.sidebar{width:260px;min-width:260px;background:var(--sidebar);color:#e2e8f0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:50}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.sidebar .logo{padding:16px 14px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
.sidebar .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#2563eb,#3b82f6);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;flex-shrink:0}
.sidebar .logo-text{font-weight:800;font-size:13px;line-height:1.3}.sidebar .logo-text span{color:#60a5fa}
.menu-group{padding:8px 0}.menu-group-label{padding:5px 16px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#475569;font-weight:700}
.menu-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:all .15s;font-size:12.5px;font-weight:500;border-left:3px solid transparent;color:#94a3b8;user-select:none}
.menu-item:hover{background:var(--sidebar-hover);color:#e2e8f0}.menu-item.active{background:rgba(37,99,235,.18);color:#60a5fa;border-left-color:#3b82f6}
.menu-item i{width:17px;text-align:center;font-size:13px}
.menu-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:20px;line-height:1.5;min-width:16px;text-align:center;flex-shrink:0}
.sidebar-user{margin-top:auto;padding:12px 14px;border-top:1px solid #1e293b;display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.sidebar-userinfo{flex:1;min-width:0}.sidebar-userinfo .name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-userinfo .role{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.topbar .page-title{font-weight:700;font-size:16px}
.topbar .date-display{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.content{flex:1;overflow-y:auto;padding:20px}.content::-webkit-scrollbar{width:5px}.content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.card{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:16px;margin-bottom:12px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.stat-card{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:14px;display:flex;align-items:center;gap:12px;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat-value{font-size:20px;font-weight:800;line-height:1}.stat-label{font-size:10px;color:var(--text-muted);margin-top:2px}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--text-muted);padding:8px 10px;text-align:left;border-bottom:2px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}tr:hover td{background:#f8fafc}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-warning{background:var(--accent);color:#fff}.btn-warning:hover{background:#d97706}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:#f8fafc}
.btn-sm{padding:4px 8px;font-size:10.5px}
.btn-ghost{background:transparent;border:none;color:var(--text-muted);padding:4px 7px;cursor:pointer;border-radius:5px}.btn-ghost:hover{color:var(--danger);background:#fee2e2}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.badge-lomba{background:#dbeafe;color:#1d4ed8}.badge-nonlomba{background:#fef3c7;color:#92400e}
.badge-ok{background:#dbeafe;color:#1d4ed8}.badge-tidak{background:#fee2e2;color:#991b1b}.badge-skip{background:#f1f5f9;color:#475569}
.badge-admin{background:#fee2e2;color:#991b1b}.badge-pengawas{background:#dbeafe;color:#1d4ed8}.badge-spv{background:#fef3c7;color:#92400e}.badge-pelaksana{background:#e0e7ff;color:#4338ca}
.form-group{margin-bottom:11px}.form-label{display:block;font-size:10px;font-weight:600;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-select,.form-textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;transition:border-color .15s;background:#fff;color:var(--text)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-textarea{resize:vertical;min-height:55px}
.radio-btn{padding:6px 9px;border-radius:20px;font-size:10.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;transition:all .15s;user-select:none;display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;color:var(--text-muted)}
.radio-btn:hover:not(.radio-disabled){border-color:#94a3b8;background:#f8fafc;transform:translateY(-1px)}
.radio-disabled{cursor:not-allowed;opacity:.45;pointer-events:none}
.radio-btn.sel-ok{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.radio-btn.sel-tidak{background:#ef4444;border-color:#ef4444;color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.35)}
.radio-btn.sel-skip{background:#94a3b8;border-color:#94a3b8;color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--card);border-radius:13px;width:92%;max-width:500px;max-height:85vh;overflow-y:auto;transform:translateY(14px) scale(.97);transition:transform .2s}
.modal-overlay.show .modal-box{transform:translateY(0) scale(1)}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-weight:700;font-size:14px}
.modal-close{width:28px;height:28px;border-radius:6px;border:none;background:#f1f5f9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);transition:all .15s}
.modal-close:hover{background:#fee2e2;color:var(--danger)}
.modal-body{padding:18px}.modal-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px}
.toast-container{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 14px;border-radius:8px;font-size:11.5px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;animation:toastIn .3s ease;box-shadow:0 6px 24px rgba(0,0,0,.15);min-width:240px;pointer-events:auto}
.toast-success{background:#2563eb}.toast-error{background:#ef4444}.toast-info{background:#3b82f6}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(30px)}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:14px 0 0}
.podium-item{display:flex;flex-direction:column;align-items:center;border-radius:10px 10px 0 0;overflow:hidden}
.podium-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 20px;color:#fff;font-weight:800;font-size:18px;min-width:100px}
.podium-label{font-size:10px;font-weight:600;padding:6px 12px;background:#f8fafc;color:var(--text);width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-1 .podium-bar{background:linear-gradient(135deg,#f59e0b,#fbbf24);height:120px}
.podium-2 .podium-bar{background:linear-gradient(135deg,#94a3b8,#cbd5e1);height:95px;color:#334155}
.podium-3 .podium-bar{background:linear-gradient(135deg,#b45309,#d97706);height:70px}
.empty-state{text-align:center;padding:30px 14px;color:var(--text-muted)}.empty-state i{font-size:32px;margin-bottom:8px;opacity:.3;display:block}.empty-state p{font-size:12px}
.progress-bar{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden}.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.tab-group{display:flex;gap:3px;background:#f1f5f9;padding:3px;border-radius:7px}
.tab-item{padding:5px 12px;border-radius:5px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text-muted);user-select:none}
.tab-item.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.info-box{border-radius:7px;padding:9px 12px;font-size:11px;margin-bottom:12px;display:flex;align-items:start;gap:7px}
.info-box i{margin-top:2px;flex-shrink:0}
.info-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.info-ok{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.chk-section{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chk-grid{display:grid;grid-template-columns:1fr 90px 90px 200px;gap:0}
.chk-head{padding:9px 10px;background:#f8fafc;font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--text-muted);border-bottom:2px solid var(--border);text-align:center;position:sticky;top:0}
.chk-head:first-child{text-align:left}
.chk-cat{background:linear-gradient(135deg,#1e40af,#2563eb);padding:8px 12px;font-weight:700;font-size:11px;color:#fff;display:flex;align-items:center;gap:7px;letter-spacing:.3px}
.chk-cat i{font-size:10px;opacity:.85}
.chk-desc{padding:10px 10px;border-bottom:1px solid var(--border);font-size:12px;display:flex;align-items:center}
.chk-row-idx{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;background:#f1f5f9;color:var(--text-muted);font-size:9px;font-weight:700;margin-right:8px;flex-shrink:0}
.chk-cell{padding:8px 8px;border-bottom:1px solid var(--border);display:flex;gap:4px;justify-content:center;align-items:center;background:#fff}
.chk-desc.chk-item-odd,.chk-cell.chk-item-odd{background:#fafbfc}
.chk-cell-status{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.pen-toolbar{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.pen-toolbar .form-group{margin:0}
.pen-progress-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.pen-progress-wrap .progress-bar{flex:1}
.pen-progress-label{font-size:11px;font-weight:700;color:var(--text);white-space:nowrap}
.pen-save-bar{position:sticky;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;margin:14px -16px -16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.06);border-radius:0 0 11px 11px;flex-wrap:wrap;z-index:5}
.pen-save-bar .pen-save-hint{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.pen-save-bar .btn-primary{padding:9px 20px;font-size:12.5px}
@media(max-width:640px){
.chk-grid{grid-template-columns:1fr}
.chk-head:not(:first-child){display:none}
.chk-desc{border-bottom:none;padding-bottom:4px;font-weight:600}
.chk-cell{justify-content:flex-start;padding:4px 10px 4px 32px;border-bottom:none}
.chk-cell-status{justify-content:flex-start;padding:4px 10px 10px 32px;border-bottom:1px solid var(--border)}
.chk-cell::before{content:attr(data-label);font-size:9px;text-transform:uppercase;font-weight:700;color:var(--text-muted);width:64px;flex-shrink:0}
.pen-save-bar{flex-direction:column;align-items:stretch}
.pen-save-bar .btn-primary{width:100%;justify-content:center}
}
.photo-cell{flex-direction:column;gap:6px}
.photo-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;display:block}
.photo-upload-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border:1.5px dashed #94a3b8;border-radius:8px;cursor:pointer;font-size:9.5px;font-weight:700;color:var(--text-muted);text-align:center;transition:all .15s;width:100%}
.photo-upload-btn:hover{border-color:var(--primary);color:var(--primary);background:#eff6ff}
.photo-upload-btn i{font-size:16px}
.photo-retake{display:flex;align-items:center;justify-content:center;gap:4px;font-size:9px;color:var(--primary);cursor:pointer;padding:2px 6px;border-radius:5px;font-weight:600}
.photo-retake:hover{background:#eff6ff}
.ai-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;cursor:help}
.ai-badge-ok{background:#dbeafe;color:#1d4ed8}
.ai-badge-nok{background:#fee2e2;color:#991b1b}
.ai-badge-pending{background:#f1f5f9;color:#64748b}
.photo-loading{opacity:.5;pointer-events:none}
.seed-banner{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border-radius:9px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.seed-banner p{font-size:12px;font-weight:500}
.no-access{text-align:center;padding:40px;color:var(--text-muted)}.no-access i{font-size:40px;display:block;margin-bottom:10px;opacity:.3}
.area-chk-list{max-height:150px;overflow-y:auto;border:1px solid var(--border);padding:8px;border-radius:7px;background:#f8fafc}
.area-chk-list label{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;cursor:pointer}
@media(max-width:768px){.sidebar{position:fixed;left:-260px;transition:left .3s}.sidebar.open{left:0}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><div class="login-logo-icon">5R</div><div class="login-logo-text">ERP Penilaian<br><span>Program 5R</span></div></div>
    <div class="login-error" id="login-error"><i class="fas fa-circle-xmark"></i><span id="login-err-msg"></span></div>
    <div class="form-group"><label class="form-label">Username</label><input class="form-input" id="login-user" placeholder="Masukkan username" autocomplete="off"></div>
    <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="login-pass" placeholder="Masukkan password"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;font-size:13px;margin-top:4px" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i>Masuk</button>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);text-align:center">
      <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px">Pertama kali? Muat data contoh dulu:</div>
      <button class="btn btn-outline" style="width:100%;justify-content:center" onclick="seedFromLogin()"><i class="fas fa-flask"></i>Muat Data Contoh</button>
    </div>
  </div>
</div>
<div id="app" style="display:flex;height:100vh">
<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-icon">5R</div><div class="logo-text">ERP Penilaian<br><span>Program 5R</span></div></div>
  <div id="menu-container"></div>
  <div class="sidebar-user" id="sidebar-user"></div>
</aside>
<div class="main-wrap">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-ghost" id="btn-menu" style="display:none;font-size:17px" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
      <div class="page-title" id="page-title">Dashboard</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="date-display"><i class="fas fa-calendar-days"></i><span id="top-date"></span></div>
      <button class="btn btn-outline btn-sm" onclick="doLogout()" title="Keluar"><i class="fas fa-right-from-bracket"></i></button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>
<div class="modal-overlay" id="modal"><div class="modal-box"><div class="modal-header"><h3 id="modal-title"></h3><button class="modal-close" onclick="hideModal()"><i class="fas fa-xmark"></i></button></div><div class="modal-body" id="modal-body"></div><div class="modal-footer" id="modal-footer"></div></div></div>
<div class="toast-container" id="toast-box"></div>
<script>
// ==== BACKEND: SUPABASE (tanpa server sendiri, langsung REST API Postgres) ====
// TODO(SETUP): Ganti 2 nilai di bawah ini dengan punya kamu:
// 1. SUPABASE_URL   -> Project Settings > API > Project URL
// 2. SUPABASE_ANON_KEY -> Project Settings > API > anon public key
// Pastikan juga sudah menjalankan SQL setup tabel kv_store (lihat catatan Claude di chat).
var SUPABASE_URL = 'https://drsrtoxxjdzbjcsukcgr.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyc3J0b3h4amR6Ympjc3VrY2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDg5NzEsImV4cCI6MjEwMzg4NDk3MX0.12XC6Dsh_-fNv_EEOnzaqDd0ozG4vKAGAV7CcXPuIvQ';
function sbHeaders(extra){
  var h={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
var _cache = {};
var _pendingSave = {};
var _dirtyAgain = {};
function _flushSave(k, cb){
  if(_pendingSave[k]){ _dirtyAgain[k] = cb || _dirtyAgain[k] || null; return; } // sudah ada request jalan untuk key ini, tandai perlu kirim ulang
  _pendingSave[k] = true;
  fetch(SUPABASE_URL + '/rest/v1/kv_store?on_conflict=key', {
    method: 'POST',
    headers: sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),

// Kompres foto sebelum disimpan sebagai base64 di database JSON (biar payload tidak membengkak)
function compressPhoto(file,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var maxW=640;var scale=Math.min(1,maxW/img.width);
      var w=Math.round(img.width*scale)||1,h=Math.round(img.height*scale)||1;
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.6));
    };
    img.onerror=function(){cb(ev.target.result);};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

  var file=inputEl.files[0];if(!file)return;

function calcScore(areaId,y,m){var area=DB.get('areas').find(function(a){return a.id===areaId});if(!area)return null;var cls=DB.get('checklists').filter(function(c){return c.areaId===areaId});var n=cls.length;if(n===0)return{base:0,initB:0,mysP:0,kantB:0,kantP:0,final:0,area:area};var ppi=100/n;var pen=DB.get('penilaian').filter(function(p){return p.areaId===areaId&&p.date.substring(0,7)===mPrefix(y,m)});var dates=allDates(y,m);var daily=[];dates.forEach(function(date){var shifts=[];['pagi','siang'].forEach(function(shift){var rec=pen.find(function(p){return p.date===date&&p.shift===shift});if(rec&&rec.items){var t=0;cls.forEach(function(cl){var it=rec.items.find(function(i){return i.clId===cl.id});if(it&&it.picAi&&it.picAi.result==='ok'&&it.spvAi&&it.spvAi.result==='ok'&&it.pwStatus!=='expired')t+=ppi;});shifts.push(t);}});if(shifts.length>0)daily.push(shifts.reduce(function(a,b){return a+b},0)/shifts.length);});var base=daily.length>0?daily.reduce(function(a,b){return a+b},0)/daily.length:0;var pf=mPrefix(y,m);var initB=DB.get('inisiatif').filter(function(i){return i.areaId===areaId&&i.date.substring(0,7)===pf}).length*25;var mysP=DB.get('mystery').filter(function(x){return x.areaId===areaId&&x.date.substring(0,7)===pf}).length*25;var kantB=0,kantP=0;DB.get('pk_result').forEach(function(r){if(r.date.substring(0,7)!==pf)return;if(r.areaId===areaId&&r.clean&&r.verified)kantB+=100;if(!r.clean&&r.verified){var duty=getDuty(r.date,r.shift);if(duty&&duty!==areaId)kantP+=50;}});var fin=base+initB-mysP+kantB-kantP;if(area.type==='non-lomba'&&fin>100)fin=100;return{base:Math.round(base*100)/100,initB:initB,mysP:mysP,kantB:kantB,kantP:kantP,final:Math.round(fin*100)/100,area:area};}
function getDuty(date,shift){var s=DB.get('piket_kantin').find(function(p){return p.date===date&&p.shift===shift});return s?s.areaId:null;}
function getPwForDate(dateStr){var ws=weekStart(dateStr);var s=DB.get('pw_schedule').find(function(x){return x.weekStart===ws});if(!s)return null;return DB.get('users').find(function(u){return u.id===s.pwId&&u.role==='pengawas'})||null;}

function modalUser(id){

  var areas=DB.get('areas');
  var chkHtml = areas.map(function(a){ 
    var checked = (u && u.areas && u.areas.indexOf(a.id) !== -1) ? 'checked' : '';
    return '<label><input type="checkbox" class="area-chk" value="'+a.id+'" '+checked+'> '+a.name+'</label>';
  }).join('');

  var b='<div class="form-group"><label class="form-label">Nama Lengkap</label><input class="form-input" id="f-un" value="'+(u?u.name:'')+'"></div>';
  b+='<div class="form-group"><label class="form-label">Username</label><input class="form-input" id="f-uun" value="'+(u?u.username:'')+'" '+(u?'readonly style="background:#f8fafc"':'')+'></div>';
  b+='<div class="form-group"><label class="form-label">Password'+(u?' (kosongkan jika tidak diubah)':'')+'</label><input type="password" class="form-input" id="f-upw" placeholder="'+(u?'Biarkan kosong':'Masukkan password')+'"></div>';
  b+='<div class="form-group"><label class="form-label">Departemen</label><input class="form-input" id="f-ud" value="'+(u?u.dept:'')+'"></div>';
  b+='<div class="form-group"><label class="form-label">Role</label><select class="form-select" id="f-ur" onchange="toggleAreaPicker()">';
  ['admin','pengawas','spv','pelaksana'].forEach(function(r){b+='<option value="'+r+'"'+(u&&u.role===r?' selected':'')+'>'+ROLES[r]+'</option>';});
  b+='</select></div>';
  
  // DIV UNTUK MUNCUL AKAN CHECKBOX AREA
  b+='<div class="form-group" id="area-picker" style="display:'+(u && (u.role==='spv'||u.role==='pelaksana') ? 'block' : 'none')+'">';
  b+='<label class="form-label">Pilih Area Yang Bisa Diakses</label>';
  b+='<div class="area-chk-list">'+chkHtml+'</div>';
  b+='</div>';

  showModal(u?'Edit User':'Tambah User',b,'<button class="btn btn-outline" onclick="hideModal()">Batal</button><button class="btn btn-primary" onclick="saveUser(\''+(id||'')+'\')">Simpan</button>');
  setTimeout(function(){var e=document.getElementById('f-un');if(e)e.focus()},100);
}

function toggleAreaPicker(){
  var role = document.getElementById('f-ur').value;
  document.getElementById('area-picker').style.display = (role==='spv' || role==='pelaksana') ? 'block' : 'none';
}

function saveUser(id){
  var name=document.getElementById('f-un').value.trim();
  var username=document.getElementById('f-uun').value.trim().toLowerCase();
  var pass=document.getElementById('f-upw').value;
  var dept=document.getElementById('f-ud').value.trim();
  var role=document.getElementById('f-ur').value;
  if(!name||!dept){toast('Nama dan departemen wajib','error');return;}
  
  // AMBIL DATA AREA YANG DICENTANG
  var selectedAreas = [];
  if(role==='spv' || role==='pelaksana'){
    document.querySelectorAll('.area-chk:checked').forEach(function(el){ selectedAreas.push(el.value); });
    if(selectedAreas.length===0){toast('Pilih minimal 1 area untuk role ini','error');return;}
  }

  var list=DB.get('users');
  if(id){
    var i=list.findIndex(function(x){return x.id===id});
    if(i>=0){
      list[i].name=name;list[i].dept=dept;list[i].role=role;list[i].areas=selectedAreas;
      if(pass)list[i].password=pass;
    }
  }else{
    if(!username||!pass){toast('Username dan password wajib','error');return;}
    var dup=list.find(function(x){return x.username.toLowerCase()===username});
    if(dup){toast('Username sudah ada','error');return;}
    list.push({id:DB.uid(),name:name,username:username,password:pass,dept:dept,role:role,areas:selectedAreas,ts:Date.now()});
  }
  DB.set('users',list);hideModal();toast(id?'Diperbarui':'Ditambahkan');logAct((id?'Edit':'Tambah')+' user: '+name+' ('+ROLES[role]+')');pgMasterUser();
}
function delUser(id){var u=DB.get('users').find(function(x){return x.id===id});showModal('Hapus User','<p>Hapus <strong>'+(u?u.name:'')+'</strong>?</p>','<button class="btn btn-outline" onclick="hideModal()">Batal</button><button class="btn btn-danger" onclick="DB.set(\'users\',DB.get(\'users\').filter(function(x){return x.id!==\''+id+'\'}));hideModal();toast(\'Dihapus\');pgMasterUser()">Hapus</button>');}

var _pkY,_pkM;
function pgJadwalPiket(){var now=new Date();if(_pkY===undefined){_pkY=now.getFullYear();_pkM=now.getMonth();}var areas=DB.get('areas');var sched=DB.get('piket_kantin');var n=daysInMonth(_pkY,_pkM);var ao=areas.map(function(a){return'<option value="'+a.id+'">'+a.name+'</option>'}).join('');var h='<div class="card"><div class="card-header"><div class="card-title">Jadwal Piket Kantin - '+BULAN[_pkM]+' '+_pkY+'</div><div style="display:flex;gap:5px;align-items:center"><button class="btn btn-outline btn-sm" onclick="_pkM=(_pkM+11)%12;_pkY=_pkM===11?_pkY-1:_pkY;pgJadwalPiket()"><i class="fas fa-chevron-left"></i></button><span style="font-weight:600;font-size:11px;min-width:110px;text-align:center">'+BULAN[_pkM]+' '+_pkY+'</span><button class="btn btn-outline btn-sm" onclick="_pkM=(_pkM+1)%12;_pkY=_pkM===0?_pkY+1:_pkY;pgJadwalPiket()"><i class="fas fa-chevron-right"></i></button></div></div>';
  if(areas.length>0){h+='<div class="info-box info-warn"><i class="fas fa-shuffle"></i>Generate otomatis: Area untuk Pagi & Sore diacak masing-masing secara independen tiap hari (bisa beda area di hari yang sama).</div>';h+='<button class="btn btn-primary" onclick="genRollingPiket()" style="margin-bottom:12px"><i class="fas fa-shuffle"></i> Generate Rolling Piket (Acak)</button>';}
  if(areas.length>0){h+='<div style="margin-bottom:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:end"><div class="form-group" style="margin:0"><label class="form-label">Area</label><select class="form-select" id="bp-a" style="min-width:150px"><option value="">--</option>'+ao+'</select></div><div class="form-group" style="margin:0"><label class="form-label">Shift</label><select class="form-select" id="bp-s" style="min-width:80px"><option value="pagi">Pagi</option><option value="sore">Sore</option><option value="both">Keduanya</option></select></div><div class="form-group" style="margin:0"><label class="form-label">Dari</label><input type="number" class="form-input" id="bp-ds" min="1" max="'+n+'" value="1" style="width:58px"></div><div class="form-group" style="margin:0"><label class="form-label">Sampai</label><input type="number" class="form-input" id="bp-de" min="1" max="'+n+'" value="'+n+'" style="width:58px"></div><button class="btn btn-primary btn-sm" onclick="bulkPK()"><i class="fas fa-bolt"></i>Assign Manual</button></div>';}h+='<div style="max-height:420px;overflow-y:auto"><table><thead><tr><th style="width:40px;text-align:center">Tgl</th><th>Pagi</th><th>Sore</th></tr></thead><tbody>';for(var d=1;d<=n;d++){var ds=_pkY+'-'+String(_pkM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var p=sched.find(function(s){return s.date===ds&&s.shift==='pagi'});var sr=sched.find(function(x){return x.date===ds&&x.shift==='sore'});h+='<tr><td style="font-weight:600;text-align:center">'+d+'</td><td><select class="form-select" style="padding:3px 6px;font-size:10px" onchange="savePKEv(\''+ds+'\',\'pagi\',this.value)"><option value="">--</option>'+areas.map(function(a){return'<option value="'+a.id+'"'+(p&&p.areaId===a.id?' selected':'')+'>'+a.name+'</option>'}).join('')+'</select></td><td><select class="form-select" style="padding:3px 6px;font-size:10px" onchange="savePKEv(\''+ds+'\',\'sore\',this.value)"><option value="">--</option>'+areas.map(function(a){return'<option value="'+a.id+'"'+(sr&&sr.areaId===a.id?' selected':'')+'>'+a.name+'</option>'}).join('')+'</select></td></tr>';}h+='</tbody></table></div></div>';document.getElementById('content').innerHTML=h;}
function genRollingPiket(){
  var areas=DB.get('areas');
  if(areas.length===0){toast('Belum ada Area','error');return;}
  var n=daysInMonth(_pkY,_pkM);
  var list=DB.get('piket_kantin');
  for(var d=1;d<=n;d++){
    var ds=_pkY+'-'+String(_pkM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var aPagi=areas[Math.floor(Math.random()*areas.length)].id;
    var aSore=areas[Math.floor(Math.random()*areas.length)].id;
    list=list.filter(function(x){return!(x.date===ds&&(x.shift==='pagi'||x.shift==='sore'))});
    list.push({id:DB.uid(),areaId:aPagi,date:ds,shift:'pagi',ts:Date.now()});
    list.push({id:DB.uid(),areaId:aSore,date:ds,shift:'sore',ts:Date.now()});
  }
  DB.set('piket_kantin',list);
  toast('Rolling Piket berhasil di-acak!');
  pgJadwalPiket();
  logAct('Generate rolling piket (acak per shift) '+BULAN[_pkM]+' '+_pkY);
}
function savePKEv(date,shift,areaId){var list=DB.get('piket_kantin').filter(function(s){return!(s.date===date&&s.shift===shift)});if(areaId)list.push({id:DB.uid(),areaId:areaId,date:date,shift:shift,ts:Date.now()});DB.set('piket_kantin',list);}
function bulkPK(){var aId=document.getElementById('bp-a').value;var shift=document.getElementById('bp-s').value;var s=parseInt(document.getElementById('bp-ds').value)||1;var e=parseInt(document.getElementById('bp-de').value)||daysInMonth(_pkY,_pkM);if(!aId){toast('Pilih area','error');return;}var list=DB.get('piket_kantin');for(var d=s;d<=e;d++){var ds=_pkY+'-'+String(_pkM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(shift==='pagi'||shift==='both'){list=list.filter(function(x){return!(x.date===ds&&x.shift==='pagi')});list.push({id:DB.uid(),areaId:aId,date:ds,shift:'pagi',ts:Date.now()});}if(shift==='sore'||shift==='both'){list=list.filter(function(x){return!(x.date===ds&&x.shift==='sore')});list.push({id:DB.uid(),areaId:aId,date:ds,shift:'sore',ts:Date.now()});}}DB.set('piket_kantin',list);toast('Di-assign');pgJadwalPiket();}

var _jpY,_jpM;
function pgJadwalPw(){var now=new Date();if(_jpY===undefined){_jpY=now.getFullYear();_jpM=now.getMonth();}var users=DB.get('users');var depts=[...new Set(users.filter(function(u){return u.role==='pengawas'}).map(function(u){return u.dept}))].filter(Boolean);var h='<div class="card"><div class="card-header"><div class="card-title">Rolling Dept. Pengawas Harian</div><div style="display:flex;gap:5px;align-items:center"><button class="btn btn-outline btn-sm" onclick="_jpM=(_jpM+11)%12;_jpY=_jpM===11?_jpY-1:_jpY;pgJadwalPw()"><i class="fas fa-chevron-left"></i></button><span style="font-weight:600;font-size:11px;min-width:110px;text-align:center">'+BULAN[_jpM]+' '+_jpY+'</span><button class="btn btn-outline btn-sm" onclick="_jpM=(_jpM+1)%12;_jpY=_jpM===0?_jpY+1:_jpY;pgJadwalPw()"><i class="fas fa-chevron-right"></i></button></div></div>';if(depts.length>0){h+='<div class="info-box info-warn"><i class="fas fa-shuffle"></i>Satu Departemen Pengawas akan ditugaskan untuk 1 hari penuh (Pagi/Sore) secara bergantian dan acak.</div>';h+='<button class="btn btn-primary" onclick="genRollingDept()" style="margin-bottom:15px"><i class="fas fa-shuffle"></i> Generate Rolling Dept</button>';}else{h+='<div class="info-box info-warn"><i class="fas fa-exclamation-triangle"></i>Belum ada user dengan role Pengawas.</div>';}h+='<div id="rolling-container"></div></div>';document.getElementById('content').innerHTML=h;renderRollingDept();}
function genRollingDept(){var users=DB.get('users');var depts=[...new Set(users.filter(function(u){return u.role==='pengawas'}).map(function(u){return u.dept}))].filter(Boolean);var n=daysInMonth(_jpY,_jpM);for(var i=depts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var temp=depts[i];depts[i]=depts[j];depts[j]=temp;}var newSchedule=[];var idx=0;for(var d=1;d<=n;d++){var ds=_jpY+'-'+String(_jpM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');newSchedule.push({id:DB.uid(),date:ds,dept:depts[idx],shift:'Pagi/Sore'});idx++;if(idx>=depts.length)idx=0;}DB.set('rolling_dept_pengawas',newSchedule);toast('Rolling Departemen Pengawas berhasil di-acak!');renderRollingDept();logAct('Generate rolling dept pengawas '+BULAN[_jpM]+' '+_jpY);}
function renderRollingDept(){var schedule=DB.get('rolling_dept_pengawas').filter(function(s){return s.date.substring(0,7)===mPrefix(_jpY,_jpM)});var container=document.getElementById('rolling-container');if(!container)return;if(schedule.length===0){container.innerHTML='<div class="empty-state"><i class="fas fa-rotate"></i><p>Belum ada jadwal. Klik Generate.</p></div>';return;}var html='<table><thead><tr><th style="width:120px">Tanggal</th><th style="width:100px">Shift</th><th>Departemen Pengawas Yang Bertugas</th></tr></thead><tbody>';schedule.forEach(function(s){html+='<tr><td>'+fmtD(s.date)+'</td><td><span class="badge badge-spv">'+s.shift+'</span></td><td style="font-weight:700;color:var(--primary)"><i class="fas fa-building"></i> '+s.dept+'</td></tr>';});html+='</tbody></table>';container.innerHTML=html;}

// ===================== TUKAR JADWAL PENGAWAS =====================
var _tjD1='',_tjDept2='',_tjD2='',_tjReasonVal='';
function tjPengawasDepts(){return [...new Set(DB.get('users').filter(function(u){return u.role==='pengawas'}).map(function(u){return u.dept}))].filter(Boolean);}
function tjUpcoming(dept,excludeDate){var td=todayStr();return DB.get('rolling_dept_pengawas').filter(function(s){return s.dept===dept && s.date>=td && s.date!==excludeDate;}).sort(function(a,b){return a.date<b.date?-1:1;});}
function pgTukarJadwal(){
  var reqs=DB.get('swap_pengawas')||[];
  var h='<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-right-left" style="color:var(--primary)"></i>Tukar Jadwal Pengawas</div></div>';
  h+='<div class="info-box info-ok"><i class="fas fa-circle-info"></i>Contoh: hari ini jadwal Anda (mis. HR) berhalangan, ajukan tukar dengan departemen lain (mis. PPIC) yang bertugas di tanggal lain. Jika disetujui Admin, kedua jadwal akan otomatis tertukar di Rolling Pengawas.</div>';

  if(CU.role==='pengawas'){
    var myDept=CU.dept;
    var myUpcoming=tjUpcoming(myDept,null);
    var otherDepts=tjPengawasDepts().filter(function(d){return d!==myDept;});
    if(!_tjD1 && myUpcoming.length>0) _tjD1=myUpcoming[0].date;
    if(!_tjDept2 && otherDepts.length>0) _tjDept2=otherDepts[0];
    var targetUpcoming=_tjDept2?tjUpcoming(_tjDept2,_tjD1):[];
    if((!_tjD2 || !targetUpcoming.some(function(t){return t.date===_tjD2;})) && targetUpcoming.length>0) _tjD2=targetUpcoming[0].date;

    h+='<div class="pen-toolbar" style="align-items:start">';
    if(myUpcoming.length===0){
      h+='<div class="empty-state" style="width:100%"><i class="fas fa-calendar-xmark"></i><p>Departemen Anda ('+myDept+') tidak punya jadwal bertugas mendatang di Rolling Pengawas.</p></div>';
    }else if(otherDepts.length===0){
      h+='<div class="empty-state" style="width:100%"><i class="fas fa-users-slash"></i><p>Belum ada departemen pengawas lain untuk ditukar.</p></div>';
    }else{
      h+='<div class="form-group" style="min-width:170px"><label class="form-label"><i class="fas fa-calendar-day"></i> Tanggal Saya Bertugas ('+myDept+')</label><select class="form-select" onchange="_tjD1=this.value;_tjD2=\'\';pgTukarJadwal()">';
      myUpcoming.forEach(function(s){h+='<option value="'+s.date+'"'+(s.date===_tjD1?' selected':'')+'>'+fmtD(s.date)+'</option>';});
      h+='</select></div>';
      h+='<div class="form-group" style="min-width:170px"><label class="form-label"><i class="fas fa-building"></i> Tukar Dengan Departemen</label><select class="form-select" onchange="_tjDept2=this.value;_tjD2=\'\';pgTukarJadwal()">';
      otherDepts.forEach(function(d){h+='<option value="'+d+'"'+(d===_tjDept2?' selected':'')+'>'+d+'</option>';});
      h+='</select></div>';
      h+='<div class="form-group" style="min-width:170px"><label class="form-label"><i class="fas fa-calendar-day"></i> Tanggal Dept Tersebut Bertugas</label><select class="form-select" onchange="_tjD2=this.value">';
      if(targetUpcoming.length===0) h+='<option value="">-- Tidak ada jadwal --</option>';
      else targetUpcoming.forEach(function(s){h+='<option value="'+s.date+'"'+(s.date===_tjD2?' selected':'')+'>'+fmtD(s.date)+'</option>';});
      h+='</select></div>';
      h+='</div>';
      h+='<div class="form-group"><label class="form-label"><i class="fas fa-comment"></i> Alasan Tukar</label><textarea class="form-textarea" id="f-tjr" placeholder="Contoh: berhalangan hadir karena ada keperluan mendadak">'+_tjReasonVal+'</textarea></div>';
      h+='<div style="text-align:right"><button class="btn btn-primary" onclick="ajukanTukar()"'+(targetUpcoming.length===0?' disabled':'')+'><i class="fas fa-paper-plane"></i> Ajukan Tukar Jadwal</button></div>';
    }
    h+='</div>';
  }

  // Riwayat / daftar pengajuan
  var listReqs=reqs.slice().sort(function(a,b){return b.ts-a.ts;});
  if(CU.role==='pengawas') listReqs=listReqs.filter(function(r){return r.requestedBy===CU.id;});
  h+='<div class="card-header" style="margin-top:4px"><div class="card-title" style="font-size:12.5px"><i class="fas fa-clock-rotate-left"></i>'+(CU.role==='admin'?'Semua Pengajuan Tukar Jadwal':'Riwayat Pengajuan Saya')+'</div></div>';

      h+='<td style="max-width:180px;font-size:11px">'+r.reason+'</td>';
      h+='<td>'+stBadge+'</td>';
      if(CU.role==='admin'){
        if(r.status==='pending') h+='<td style="white-space:nowrap"><button class="btn btn-primary btn-sm" onclick="putusTukar(\''+r.id+'\',\'approved\')"><i class="fas fa-check"></i></button> <button class="btn btn-danger btn-sm" onclick="putusTukar(\''+r.id+'\',\'rejected\')"><i class="fas fa-xmark"></i></button></td>';

function batalTukar(id){

function putusTukar(id,decision){

function pgRekap(){var now=new Date();if(_rbY===undefined){_rbY=now.getFullYear();_rbM=now.getMonth();}var areas=DB.get('areas');var h='<div class="card"><div class="card-header"><div class="card-title">Rekap Bulanan</div><div style="display:flex;gap:5px;align-items:center"><button class="btn btn-outline btn-sm" onclick="_rbM=(_rbM+11)%12;_rbY=_rbM===11?_rbY-1:_rbY;pgRekap()"><i class="fas fa-chevron-left"></i></button><span style="font-weight:600;font-size:11px;min-width:110px;text-align:center">'+BULAN[_rbM]+' '+_rbY+'</span><button class="btn btn-outline btn-sm" onclick="_rbM=(_rbM+1)%12;_rbY=_rbM===0?_rbY+1:_rbY;pgRekap()"><i class="fas fa-chevron-right"></i></button></div></div>';if(areas.length===0){h+='<div class="empty-state"><p>Belum ada area.</p></div>';}else{h+='<table><thead><tr><th>No</th><th>Area</th><th>Tipe</th><th>Skor Dasar</th><th>Inisiatif</th><th>Mystery</th><th>Kantin</th><th>Skor Akhir</th></tr></thead><tbody>';var scores=[];areas.forEach(function(a){var s=calcScore(a.id,_rbY,_rbM);if(s){scores.push(s);var bg=s.area.type==='lomba'?'':'style="background:#fffbeb"';h+='<tr '+bg+'><td>'+(scores.length)+'</td><td style="font-weight:600">'+s.area.name+'</td><td><span class="badge '+(s.area.type==='lomba'?'badge-lomba':'badge-nonlomba')+'">'+(s.area.type==='lomba'?'Lomba':'Non-Lomba')+'</span></td><td>'+s.base+'</td><td style="color:var(--primary)">+'+s.initB+'</td><td style="color:var(--danger)">-'+s.mysP+'</td><td style="color:'+(s.kantB-s.kantP>=0?'var(--primary)':'var(--danger)')+'">'+((s.kantB-s.kantP>=0?'+':'')+(s.kantB-s.kantP))+'</td><td style="font-weight:800;font-size:14px">'+s.final+'</td></tr>';}});h+='</tbody></table>';}h+='</div>';document.getElementById('content').innerHTML=h;}

function pgKlasemen(){var now=new Date();if(_klY===undefined){_klY=now.getFullYear();_klM=now.getMonth();}var areas=DB.get('areas').filter(function(a){return a.type==='lomba'});var scores=[];areas.forEach(function(a){var s=calcScore(a.id,_klY,_klM);if(s)scores.push(s);});scores.sort(function(a,b){return b.final-a.final});var h='<div class="card"><div class="card-header"><div class="card-title">Klasemen Lomba 5R</div><div style="display:flex;gap:5px;align-items:center"><button class="btn btn-outline btn-sm" onclick="_klM=(_klM+11)%12;_klY=_klM===11?_klY-1:_klY;pgKlasemen()"><i class="fas fa-chevron-left"></i></button><span style="font-weight:600;font-size:11px;min-width:110px;text-align:center">'+BULAN[_klM]+' '+_klY+'</span><button class="btn btn-outline btn-sm" onclick="_klM=(_klM+1)%12;_klY=_klM===0?_klY+1:_klY;pgKlasemen()"><i class="fas fa-chevron-right"></i></button></div></div>';if(scores.length<3){h+='<div class="empty-state"><i class="fas fa-trophy"></i><p>Minimal 3 area lomba dengan data penilaian untuk menampilkan podium.</p></div>';}else{h+='<div class="podium">';for(var i=0;i<3;i++){h+='<div class="podium-item podium-'+(i+1)+'"><div class="podium-bar">'+(i+1)+'</div><div class="podium-label">'+scores[i].area.name+'<br><small>('+scores[i].final+')</small></div></div>';}h+='</div>';}h+='<table style="margin-top:15px"><thead><tr><th>Peringkat</th><th>Area</th><th>Skor Akhir</th></tr></thead><tbody>';scores.forEach(function(s,i){h+='<tr><td style="font-weight:800">'+(i+1)+'</td><td style="font-weight:600">'+s.area.name+'</td><td style="font-weight:800;color:var(--primary)">'+s.final+'</td></tr>';});h+='</tbody></table></div>';document.getElementById('content').innerHTML=h;}

// Kalau tanggal sudah lewat (bukan hari ini lagi) dan Pengawas belum sempat cek (masih 'skip'/kosong),
// otomatis ubah jadi 'tidak' (artinya: Pengawas tidak periksa). Dijalankan tiap kali aplikasi dibuka.
function autoCloseMissedPengawas(){
  var today=todayStr();
  var list=DB.get('penilaian');
  var changed=false;
  list.forEach(function(p){
    if(p.date<today && !p.pwAutoClosed){
      p.items.forEach(function(it){ if(it.pwStatus==='pending'){ it.pwStatus='expired'; it.pwAuto=true; changed=true; } });
      p.pwAutoClosed=true;
    }
  });
  if(changed) DB.set('penilaian', list);
}

document.getElementById('top-date').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
loadAllDataFromServer(function(){
  ensureAdmin();
  autoCloseMissedPengawas();
  applyBranding();
  var s=getSession();if(s){CU=s;document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';buildMenu();buildSidebarUser();nav('dashboard');}
});
</script>
